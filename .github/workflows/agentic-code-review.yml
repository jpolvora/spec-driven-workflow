name: Agentic Code Review

# Agentic Code Review Workflow (powered by agentic-code-reviewers)
#
# Repository Variables (configure via Settings -> Secrets and variables -> Actions -> Variables):
#   - SDW_CODE_REVIEW_ENGINE: Review engine ('opencode' or 'cursor-sdk', default: 'opencode')
#   - SDW_CODE_REVIEW_MODEL: Model identifier (default: 'opencode-go/deepseek-v4.1-flash')
#   - SDW_CODE_REVIEW_VARIANT: Review variant/intensity (default: 'medium')
#
# Required Secrets (configure via Settings -> Secrets and variables -> Actions -> Secrets):
#   - OPENCODE_API_KEY: Required when using the 'opencode' engine
#   - CURSOR_API_KEY: Required when using the 'cursor-sdk' engine
#
# Permissions:
#   - contents: read
#   - pull-requests: write
#
# Branch Protection Expectations:
#   - Add 'Agentic Code Review / review' and 'CI / test' to required status checks before merging.

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (required for manual runs)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agentic-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  REVIEW_ENGINE: ${{ vars.SDW_CODE_REVIEW_ENGINE || 'opencode' }}
  REVIEW_MODEL: ${{ vars.SDW_CODE_REVIEW_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
  REVIEW_VARIANT: ${{ vars.SDW_CODE_REVIEW_VARIANT || 'medium' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show reviewer configuration
        run: |
          echo "engine=${REVIEW_ENGINE} model=${REVIEW_MODEL} variant=${REVIEW_VARIANT}"

      - name: Detect credentials & fork environment
        id: creds
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${REVIEW_ENGINE}" == "cursor-sdk" || "${REVIEW_ENGINE}" == "cursor" ]]; then
            if [[ -z "${CURSOR_API_KEY:-}" ]]; then
              echo "::notice::Review skipped: no OPENCODE_API_KEY or CURSOR_API_KEY secret configured"
              echo "has_creds=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
              echo "::notice::Review skipped: no OPENCODE_API_KEY or CURSOR_API_KEY secret configured"
              echo "has_creds=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "has_creds=true" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode CLI
        if: ${{ steps.creds.outputs.has_creds == 'true' && env.REVIEW_ENGINE == 'opencode' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "Installing opencode v${VERSION}"
          curl -fsSL https://opencode.ai/install -o /tmp/opencode-install.sh
          bash /tmp/opencode-install.sh --version "$VERSION"
          echo "${HOME}/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.opencode/bin:${PATH}"
          command -v opencode
          opencode --version

      - name: Resolve PR context
        id: pr
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR="${{ github.event.pull_request.number }}"
            HEAD_REF="${{ github.head_ref }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            PR="${{ github.event.inputs.pr_number }}"
            [[ -n "$PR" ]] || { echo "::error::workflow_dispatch requires pr_number"; exit 1; }
            HEAD_REF="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
            BASE_REF="$(gh pr view "$PR" --json baseRefName --jq .baseRefName)"
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$PR ($HEAD_REF → $BASE_REF)"

      - name: Execute agentic code reviewer
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_CODE_REVIEWERS_TIMEOUT_MS: "1200000"
          AGENTIC_CODE_REVIEWERS_EXTRA_EXCLUDE_PATTERNS: ".sdw/state/**"
        run: |
          set -euo pipefail
          if [[ "${REVIEW_ENGINE}" == "cursor-sdk" || "${REVIEW_ENGINE}" == "cursor" ]]; then
            ENGINE_ARG="cursor-sdk"
          else
            ENGINE_ARG="opencode"
            export PATH="${HOME}/.opencode/bin:${PATH}"
          fi
          curl -fsSL https://raw.githubusercontent.com/jpolvora/agentic-code-reviewers/release/run.sh \
            -o /tmp/agentic-code-reviewers-run.sh
          bash /tmp/agentic-code-reviewers-run.sh \
            --engine "$ENGINE_ARG" \
            --model "$REVIEW_MODEL" \
            --variant "$REVIEW_VARIANT" \
            --gh \
            --pr-id "${{ steps.pr.outputs.number }}" \
            --stack Custom \
            --custom-prompt .github/agentic-code-reviewers-prompt.md \
            --score-min 5 \
            --include-patterns "**/*.md,**/*.yml,**/*.yaml,**/*.json,**/*.js,**/*.ts,**/*.cjs,**/*.sh" \
            --source-branch "refs/heads/${{ steps.pr.outputs.head_ref }}" \
            --target-branch "refs/heads/${{ steps.pr.outputs.base_ref }}"

      - name: Check for unresolved threads
        id: check-threads
        if: ${{ steps.creds.outputs.has_creds == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          ACTIVE="$(gh api graphql \
            -f query='query($o:String!,$n:String!,$p:Int!){
              repository(owner:$o,name:$n){
                pullRequest(number:$p){
                  reviewThreads(first:100){ nodes { isResolved isOutdated } }
                }
              }
            }' \
            -f o="${{ github.repository_owner }}" \
            -f n="${{ github.event.repository.name }}" \
            -F p="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false and .isOutdated == false)] | length')"
          echo "active_threads=${ACTIVE}" >> "$GITHUB_OUTPUT"
          echo "Unresolved review threads: ${ACTIVE}"

      - name: Block merge on unresolved threads
        if: ${{ steps.creds.outputs.has_creds == 'true' && steps.check-threads.outputs.active_threads != '0' }}
        run: |
          echo "::error::PR has ${{ steps.check-threads.outputs.active_threads }} unresolved review thread(s). Resolve them before merging."
          exit 1
